services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leepasports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/leepasports
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHANNEL_LAYER_URL: redis://redis:6379/2
      SECURE_SSL_REDIRECT: "False"
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports: ["8000:8000"]
    volumes: ["media:/app/media"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/leepasports
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHANNEL_LAYER_URL: redis://redis:6379/2
    command: celery -A config worker -l info --concurrency 2
    volumes: ["media:/app/media"]
    depends_on: [db, redis]
  beat:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postgres:postgres@db:5432/leepasports
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    command: celery -A config beat -l info
    depends_on: [db, redis]
volumes:
  pgdata:
  media:
